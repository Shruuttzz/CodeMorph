spring.application.name=CodeMorph-backend
# Groq: primary LLM
codemorph.llm.groq.base-url=https://api.groq.com/openai/v1
codemorph.llm.groq.api-key=${GROQ_API_KEY:}
codemorph.llm.groq.model=openai/gpt-oss-120b

# Ollama: local fallback
codemorph.llm.ollama.base-url=http://localhost:11434
codemorph.llm.ollama.model=qwen2.5-coder:3b
